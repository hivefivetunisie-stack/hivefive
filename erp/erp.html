<html lang="fr">
<head>

<style>
:root{
  --bg:#F5F3EF;--white:#FFF;--sand:#EDE9E1;--border:#DDD9D0;
  --ink:#18160F;--ink2:#4A4740;--ink3:#8A877F;--ink4:#B8B5AE;
  --hf:#2E86AB;--hf2:#E8F4FA;--hf3:#A8D4E8;
  --sg:#E8541A;--sg2:#FDF0E8;
  --bl:#1E3A8A;--bl2:#EBF1FF;--bl3:#BCCFFD;
  --ok-c:#0F5C2E;--ok-bg:#E6F5EE;
  --wa-c:#7C3A00;--wa-bg:#FFF4E6;
  --er-c:#8B1010;--er-bg:#FDEAEA;
  --r:6px;--r2:10px;--r3:14px;
  --sh:0 1px 3px rgba(24,22,15,.05),0 2px 8px rgba(24,22,15,.04);
  --shm:0 6px 24px rgba(24,22,15,.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;overflow-x:hidden;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--sand);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.4}}
/* LOGIN */
#LS{position:fixed;inset:0;z-index:2000;background:var(--ink);display:flex;align-items:center;justify-content:center;}
.lc{background:var(--white);border-radius:20px;padding:48px;width:420px;box-shadow:0 40px 100px rgba(0,0,0,.45);animation:fadeUp .4s cubic-bezier(.16,1,.3,1);}
.le{width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,var(--hf),var(--bl));display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;}
.lc h1{font-family:"Instrument Serif",serif;font-size:24px;text-align:center;margin-bottom:4px;}
.lc p{font-size:12px;color:var(--ink3);text-align:center;margin-bottom:32px;}
.le-err{background:var(--er-bg);border:1px solid #F5C4C4;color:var(--er-c);padding:10px 14px;border-radius:var(--r);font-size:12px;margin-bottom:14px;display:none;}
.lf{margin-bottom:14px;}
.lf label{display:block;font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px;}
.lf input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--r);font-family:"DM Sans",sans-serif;font-size:14px;color:var(--ink);background:var(--bg);outline:none;transition:all .2s;}
.lf input:focus{border-color:var(--hf);background:var(--white);box-shadow:0 0 0 3px var(--hf2);}
.lb{width:100%;padding:12px;background:var(--ink);color:#fff;border:none;border-radius:var(--r);font-family:"DM Sans",sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
.lb:hover{background:var(--ink2);}
/* ENTITY BAR */
#APP{display:none;min-height:100vh;}
.ebar{position:fixed;top:0;left:0;right:0;z-index:200;background:var(--ink);height:44px;display:flex;align-items:center;padding:0 16px;gap:4px;}
.eb{display:flex;align-items:center;gap:6px;padding:5px 14px;border-radius:20px;border:none;cursor:pointer;font-family:"DM Sans",sans-serif;font-size:12px;font-weight:600;transition:all .2s;color:rgba(255,255,255,.45);background:transparent;}
.eb .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.eb:hover:not(.act){background:rgba(255,255,255,.07);color:rgba(255,255,255,.8);}
.eb.act.cons{background:var(--bl);color:#fff;}
.eb.act.hf{background:var(--hf);color:#fff;}
.eb.act.sg{background:var(--sg);color:#fff;}
.eb-sep{width:1px;height:18px;background:rgba(255,255,255,.1);margin:0 6px;}
.eb-r{margin-left:auto;display:flex;align-items:center;gap:8px;}
.eb-clk{font-family:"DM Mono",monospace;font-size:11px;color:rgba(255,255,255,.4);padding:2px 8px;background:rgba(255,255,255,.06);border-radius:5px;}
.eb-usr{font-size:11px;color:rgba(255,255,255,.35);}
.eb-out{background:transparent;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);padding:4px 12px;border-radius:20px;font-size:11px;cursor:pointer;font-family:"DM Sans",sans-serif;}
.eb-out:hover{color:#fff;border-color:rgba(255,255,255,.4);}
/* SIDEBAR */
.shell{display:flex;min-height:100vh;padding-top:44px;}
.sidebar{position:fixed;top:44px;left:0;bottom:0;width:218px;background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:100;}
.sb-h{padding:14px 16px 12px;border-bottom:1px solid var(--border);}
.sb-name{font-family:"Instrument Serif",serif;font-size:15px;color:var(--ink);}
.sb-tag{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;margin-top:4px;}
.sb-nav{flex:1;overflow-y:auto;padding:8px;}
.sb-grp{font-size:9px;font-weight:700;color:var(--ink4);text-transform:uppercase;letter-spacing:1px;padding:10px 8px 4px;}
.si{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:var(--r);cursor:pointer;color:var(--ink3);font-size:12px;font-weight:500;transition:all .15s;user-select:none;}
.si:hover{background:var(--sand);color:var(--ink);}
.si.on{background:var(--sand);color:var(--ink);font-weight:600;}
.si .bar{width:2px;height:13px;border-radius:2px;flex-shrink:0;opacity:0;transition:opacity .2s;}
.si.on .bar{opacity:1;}
.si svg{width:13px;height:13px;flex-shrink:0;}
.si-bdg{margin-left:auto;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;}
.sb-ft{padding:12px 16px;border-top:1px solid var(--border);}
.sb-fn{font-size:10px;font-weight:600;color:var(--ink3);}
.sb-fm{font-size:10px;color:var(--ink4);font-family:"DM Mono",monospace;margin-top:1px;}
/* MAIN */
.main{margin-left:218px;flex:1;min-height:calc(100vh - 44px);}
.topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 24px;height:50px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:44px;z-index:50;}
.tb-l{display:flex;align-items:center;gap:8px;}
.tb-ttl{font-size:14px;font-weight:600;}
.epill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:8px;font-size:9px;font-weight:700;}
.page{padding:22px 24px;display:none;}
.page.on{display:block;animation:fadeUp .2s ease;}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:var(--r);font-family:"DM Sans",sans-serif;font-size:12px;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap;}
.btn svg{width:12px;height:12px;}
.btn-dk{background:var(--ink);color:#fff;}.btn-dk:hover{background:var(--ink2);}
.btn-ol{background:var(--white);color:var(--ink2);border:1px solid var(--border);}.btn-ol:hover{background:var(--sand);}
.btn-gh{background:transparent;color:var(--ink3);}.btn-gh:hover{background:var(--sand);color:var(--ink);}
.btn-hf{background:var(--hf);color:#fff;}.btn-hf:hover{background:#155A3C;}
.btn-sg{background:var(--sg);color:#fff;}.btn-sg:hover{background:#A84209;}
.btn-ok{background:var(--ok-bg);color:var(--ok-c);border:1px solid var(--hf3);}
.btn-warn{background:var(--wa-bg);color:var(--wa-c);border:1px solid #FCD34D;}
.btn-err{background:var(--er-bg);color:var(--er-c);border:1px solid #F5C4C4;}
.btn-sm{padding:5px 10px;font-size:11px;}.btn-xs{padding:3px 8px;font-size:10px;}
.btn-ico{background:var(--white);color:var(--ink3);border:1px solid var(--border);border-radius:var(--r);width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;}
.btn-ico:hover{background:var(--sand);color:var(--ink);}
.btn-ico svg{width:12px;height:12px;}
/* CARDS */
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--sh);}
.ch{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.ct{font-size:13px;font-weight:600;}
.cb{padding:16px;}
.stat{background:var(--white);border:1px solid var(--border);border-radius:var(--r2);padding:16px;box-shadow:var(--sh);position:relative;overflow:hidden;}
.stat::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;}
.stat.shf::after{background:var(--hf);}.stat.ssg::after{background:var(--sg);}.stat.sbl::after{background:var(--bl);}.stat.swa::after{background:#D97706;}.stat.ser::after{background:var(--er-c);}
.stat-l{font-size:9px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
.stat-v{font-size:20px;font-weight:700;font-family:"DM Mono",monospace;}
.stat-s{font-size:10px;color:var(--ink4);margin-top:3px;}
/* GRIDS/FORMS */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.fr{display:grid;gap:10px;margin-bottom:10px;}
.c2{grid-template-columns:1fr 1fr;}.c3{grid-template-columns:repeat(3,1fr);}.c4{grid-template-columns:repeat(4,1fr);}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg label{font-size:10px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;}
.fg input,.fg select,.fg textarea{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);padding:7px 11px;color:var(--ink);font-family:"DM Sans",sans-serif;font-size:13px;outline:none;transition:all .15s;width:100%;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--hf);background:var(--white);}
.fg textarea{resize:vertical;min-height:60px;}
.fg input[readonly]{font-family:"DM Mono",monospace;font-size:12px;font-weight:600;background:var(--bl2);border-color:var(--bl3);color:var(--bl);}
/* TABLE */
.tw{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{padding:7px 12px;text-align:left;font-size:9px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--sand);white-space:nowrap;}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
tbody tr:last-child{border:none;}
tbody tr:hover{background:var(--sand);}
tbody td{padding:8px 12px;}
/* BADGES */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:8px;font-size:9px;font-weight:700;}
.bdg::before{content:"";width:4px;height:4px;border-radius:50%;}
.b-ok{background:var(--ok-bg);color:var(--ok-c);}.b-ok::before{background:var(--ok-c);}
.b-pend{background:var(--wa-bg);color:var(--wa-c);}.b-pend::before{background:var(--wa-c);}
.b-draft{background:var(--sand);color:var(--ink3);}.b-draft::before{background:var(--ink4);}
.b-err{background:var(--er-bg);color:var(--er-c);}.b-err::before{background:var(--er-c);}
.b-bl{background:var(--bl2);color:#3730A3;}.b-bl::before{background:#4F46E5;}
/* OVERLAY */
.ov{position:fixed;inset:0;background:rgba(24,22,15,.6);z-index:500;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px;}
.ov.on{display:flex;animation:fadeUp .2s ease;}
.ob{background:var(--white);border-radius:var(--r3);overflow:hidden;box-shadow:var(--shm);flex-shrink:0;width:100%;max-width:640px;margin:auto;}
/* MISC */
.mono{font-family:"DM Mono",monospace;}.muted{color:var(--ink3);}.sm{font-size:11px;}
.flex{display:flex;}.fb{display:flex;justify-content:space-between;align-items:center;}
.gap4{gap:4px;}.gap6{gap:6px;}.gap8{gap:8px;}
.mb8{margin-bottom:8px;}.mb12{margin-bottom:12px;}.mb16{margin-bottom:16px;}.mb20{margin-bottom:20px;}
.mt8{margin-top:8px;}.mt12{margin-top:12px;}
.divider{border:none;border-top:1px solid var(--border);margin:12px 0;}
.empty{text-align:center;padding:32px;color:var(--ink3);font-size:12px;}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;}
.tab{padding:7px 14px;background:none;border:none;color:var(--ink3);font-size:12px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:"DM Sans",sans-serif;transition:all .15s;}
.tab.on{color:var(--ink);border-bottom-color:var(--ink);}
.tp{display:none;}.tp.on{display:block;}
/* POINTAGE */
.pt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;}
.ec{background:var(--white);border:1px solid var(--border);border-radius:var(--r2);padding:14px;box-shadow:var(--sh);position:relative;transition:all .2s;}
.ec.in{border:2px solid var(--hf);box-shadow:0 0 0 3px var(--hf2);}
.ec-dot{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;}
.ec-dot.in{background:var(--hf);animation:pulse2 2s infinite;}
.ec-dot.out{background:var(--border);}
.ec-name{font-size:13px;font-weight:600;margin-bottom:2px;}
.ec-role{font-size:10px;color:var(--ink3);}
.ec-time{font-family:"DM Mono",monospace;font-size:20px;font-weight:700;margin:10px 0 4px;}
.ec-cost{font-size:11px;color:var(--hf);font-weight:600;}
/* ESPACES — CARDS RICHES */
.sp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.sc{background:var(--white);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh);transition:all .2s;}
.sc:hover{box-shadow:var(--shm);transform:translateY(-2px);}
.sc-banner{height:6px;}
.sc-inner{padding:14px;}
.sc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.sc-name{font-size:14px;font-weight:700;color:var(--ink);}
.sc-type{font-size:9px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.sc-info{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px;}
.sc-info-item{display:flex;flex-direction:column;gap:2px;}
.sc-info-item label{font-size:9px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.sc-info-item span{font-size:12px;font-weight:500;}
.sc-tarifs{background:var(--sand);border-radius:var(--r);padding:8px 10px;margin-bottom:10px;}
.sc-tarif-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;}
.sc-tarif-row .lbl{color:var(--ink3);}
.sc-tarif-row .val{font-family:"DM Mono",monospace;font-weight:600;}
.sc-status-bar{display:flex;justify-content:space-between;align-items:center;padding-top:8px;border-top:1px solid var(--border);}
/* STOCK */
.stk-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r2);padding:14px;box-shadow:var(--sh);}
.stk-bar{height:4px;border-radius:2px;background:var(--border);margin:8px 0 4px;overflow:hidden;}
.stk-fill{height:100%;border-radius:2px;transition:width .3s;}
/* BUVETTE */
.mi-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r2);padding:12px;box-shadow:var(--sh);cursor:pointer;transition:all .2s;text-align:center;}
.mi-card:hover{border-color:var(--hf);transform:translateY(-1px);}
/* TRAVAUX / CONTRATS */
.tr-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r2);padding:14px;box-shadow:var(--sh);}
.co-card{background:var(--white);border:1px solid var(--border);border-left:3px solid;border-radius:var(--r2);padding:14px;box-shadow:var(--sh);}
/* PLANNING AGENDA */
.agenda-slot{background:var(--hf2);border:1px solid var(--hf3);border-radius:var(--r);padding:6px 10px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.agenda-libre{background:var(--ok-bg);border:1px solid var(--hf3);border-radius:var(--r);padding:6px 10px;font-size:11px;color:var(--ok-c);}
#INV{font-family:"DM Sans","Arial",sans-serif;color:#18160F;background:#fff;}
.btn-prim{background:var(--ink);color:#fff;border:none;cursor:pointer;}.btn-ok{background:var(--hf);color:#fff;border:none;cursor:pointer;}
#SYNC-STATUS:hover{background:var(--sand)!important;}
#SYNC-STATUS.synced{border-color:var(--hf);background:var(--hf2)!important;}
#SYNC-STATUS.synced #SYNC-TXT{color:var(--hf);}
#SYNC-STATUS.err{border-color:var(--er-c);background:var(--er-bg)!important;}
#SYNC-STATUS.err #SYNC-TXT{color:var(--er-c);}
#SYNC-STATUS.saving{border-color:var(--bl);background:var(--bl2)!important;}
#SYNC-STATUS.saving #SYNC-TXT{color:var(--bl);}
@keyframes spin{to{transform:rotate(360deg)}}


/* Invoice print styles */
@media print {
  #LS,#APP .ebar,.sidebar,#SYNC-STATUS { display:none!important; }
  #OV-INV { position:static!important;display:block!important;background:none!important; }
  #OV-INV .ob { box-shadow:none!important;border-radius:0!important;max-width:100%!important; }
}
</style>

      // Merge intelligente: ne pas écraser avec des données vides
      Object.keys(p).forEach(k=>{
        if(!(k in S)) return;
        const val=p[k], cur=S[k];
        // Tableau: ne prendre que si non vide
        if(Array.isArray(val)){
          if(val.length>0) S[k]=val;
        }
        // Objet avec sous-tableaux (facs, achs, ribs)
        else if(val && typeof val==='object' && !Array.isArray(val)){
          if(typeof cur==='object' && cur !== null){
            Object.keys(val).forEach(sk=>{
              const sv=val[sk];
              if(Array.isArray(sv)){if(sv.length>0) S[k][sk]=sv;}
              else S[k][sk]=sv;
            });
          }
        }
        // Scalaire (ent, facEnt, etc.)
        else{S[k]=val;}
      });
    }
  }catch(e){console.warn('load error',e);}
};

function login(){

  e.style.display='none';
  if(!u||!p){e.textContent='Champs requis';e.style.display='block';return;}

  $('LS').style.display='none';$('APP').style.display='block';initApp();
}

function buildSidebar(e){
  const E=EC[e];const p=e==='hf'?S.params.hf:e==='sg'?S.params.sg:null;
  $('SB-NAME').textContent=e==='cons'?'Vue consolidée':e==='hf'?(p?.nomCom||'HiveFive'):(p?.nom||'Synergy');
  // Afficher le logo de l'entité active dans la sidebar
  const logoEl=$('SB-LOGO');
  if(logoEl){
    if(e==='hf'&&S.params.hf.logo){logoEl.src=S.params.hf.logo;logoEl.style.display='block';}
    else if(e==='sg'&&S.params.sg.logo){logoEl.src=S.params.sg.logo;logoEl.style.display='block';}
    else{logoEl.style.display='none';}
  }
  $('SB-TAG').style.background=E.bg;$('SB-TAG').style.color=E.color;
  $('SB-DOT').style.background=E.color;$('SB-TXT').textContent=E.txt;
  $('SB-FN').textContent=e==='cons'?'OTELCO + Synergy':(p?.nom||'—');
  $('SB-FM').textContent=e==='cons'?'Multi-entités':('MF: '+(p?.mf||'—'));
  const nbF=getAllFacs().length,nbA=getAllAchs().length;
  const nbP=(S.pts||[]).filter(p=>p.date===today()&&!p.out).length;
  const nbE=(S.espaces||[]).filter(x=>x.status==='dispo').length;
  const nbAbo=(S.abonnes||[]).filter(x=>statusAbo(x)!=='expire').length;
  const nbStk=(S.stock||[]).filter(i=>i.qty<=i.min).length;
  const nbTrav=(S.travaux||[]).filter(t=>t.status!=='fait').length;
  const bk={facs:nbF,achs:nbA,pts:nbP,espaces:nbE,abonnes:nbAbo,stk:nbStk,trav:nbTrav};
  $('SB-NAV').innerHTML=NAV.map(sec=>`<div class="sb-grp">${sec.g}</div>${sec.items.map(it=>{const nb=it.bk&&bk[it.bk]>0?`<span class="si-bdg" style="background:${E.bg};color:${E.color};">${bk[it.bk]}</span>`:'';return`<div class="si" onclick="nav('${it.id}')"><span class="bar" style="background:${E.color};"></span><svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="${it.ic}" clip-rule="evenodd"/></svg>${esc(it.lbl)}${nb}</div>`;}).join('')}`).join('');
}

function renderDash(dateFrom, dateTo){
  const el=document.getElementById('DASH');
  if(!el) return;
  
  try {
    // Données de base
    const mo = today().slice(0,7);
    const fs = getAllFacs ? getAllFacs() : [];
    const as = getAllAchs ? getAllAchs() : [];
    const emps = (S.emps||[]).filter(e=>e.ent==='sg');
    const espTotal = (S.espaces||[]).length;
    const espOcc = (S.espaces||[]).filter(e=>e.status==='loue'||(S.contrats||[]).some(co=>co.espace===e.id)||(S.abonnes||[]).some(a=>a.espace===e.id)).length;
    const txOcc = espTotal>0 ? Math.round(espOcc/espTotal*100) : 0;
    const caTotal = fs.reduce((s,f)=>s+(f.totals?.ttc||0),0);
    const chargesTotal = as.reduce((s,a)=>s+(a.ttc||0),0)+(S.charges||[]).reduce((s,ch)=>s+(ch.mnt||0),0);
    const margeTotal = caTotal - chargesTotal;
    const caMois = fs.filter(f=>(f.date||'').startsWith(mo)).reduce((s,f)=>s+(f.totals?.ttc||0),0);
    const achMois = as.filter(a=>(a.date||'').startsWith(mo)).reduce((s,a)=>s+(a.ttc||0),0);
    const alStk = (S.stock||[]).filter(s=>s.qte<=(s.qteMin||0)).length;
    const travU = (S.travaux||[]).filter(t=>t.prio==='urgent'&&t.status!=='fait').length;
    const facImpa = fs.filter(f=>f.status==='pending'||f.status==='sent').length;
    const aboExp = (S.abonnes||[]).filter(a=>{try{return new Date(a.to)<new Date()&&a.to;}catch(e){return false;}}).length;
    const coExp = (S.contrats||[]).filter(a=>{try{return new Date(a.fin)<new Date()&&a.fin;}catch(e){return false;}}).length;
    const buvRecetteAuj = (S.ventes||[]).filter(v=>v.date===today()).reduce((s,v)=>s+v.total,0);
    const buvRecetteMois = (S.ventes||[]).filter(v=>(v.date||'').startsWith(mo)).reduce((s,v)=>s+v.total,0);
    const buvAchMois = (S.achs?.hf||[]).filter(a=>a.cat&&(a.cat.includes('buvette')||a.cat.includes('Boissons')||a.cat.includes('Restauration'))&&(a.date||'').startsWith(mo)).reduce((s,a)=>s+(a.ttc||0),0);
    const buvBenef = buvRecetteMois - buvAchMois;
    const buvCreditDu = (S.credits||[]).filter(cr=>!cr.solde).reduce((s,cr)=>s+(cr.montant||0)-(cr.paye||0),0);
    
    el.innerHTML = `
    <div style="padding:4px 0 16px;">
      <div style="font-family:var(--font-serif);font-size:22px;margin-bottom:4px;">Tableau de bord</div>
      <div style="font-size:11px;color:var(--ink3);">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div>
    </div>

    <!-- KPIs consolidés -->
    <div class="g5 mb14">
      <div class="stat shf">
        <div class="stat-l">CA Total</div>
        <div class="stat-v">${fN(caTotal)}</div>
        <div class="stat-s">TND toutes entités</div>
      </div>
      <div class="stat ser">
        <div class="stat-l">Charges</div>
        <div class="stat-v">${fN(chargesTotal)}</div>
        <div class="stat-s">TND</div>
      </div>
      <div class="stat ${margeTotal>=0?'shf':'ser'}">
        <div class="stat-l">Marge nette</div>
        <div class="stat-v">${margeTotal>=0?'+':''}${fN(margeTotal)}</div>
        <div class="stat-s">TND</div>
      </div>
      <div class="stat sbl">
        <div class="stat-l">Taux d'occ.</div>
        <div class="stat-v">${txOcc}%</div>
        <div class="stat-s">${espOcc}/${espTotal} espaces</div>
      </div>
      <div class="stat ssg">
        <div class="stat-l">Agents SG</div>
        <div class="stat-v">${emps.length}</div>
        <div class="stat-s">actifs</div>
      </div>
    </div>

    <!-- Ce mois -->
    <div class="g3 mb14">
      <div class="card" style="padding:16px;border-top:3px solid var(--hf);">
        <div style="font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:10px;">📊 CE MOIS — ${mo}</div>
        <div class="fb mb6"><span style="font-size:11px;">CA facturé</span><span style="font-family:var(--font-mono);font-weight:700;color:var(--hf);">${fN(caMois)} TND</span></div>
        <div class="fb"><span style="font-size:11px;">Achats</span><span style="font-family:var(--font-mono);color:var(--er-c);">${fN(achMois)} TND</span></div>
      </div>
      <div class="card" style="padding:16px;border-top:3px solid var(--sg);">
        <div style="font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:10px;">☕ BUVETTE</div>
        <div class="fb mb6"><span style="font-size:11px;">Recette auj.</span><span style="font-family:var(--font-mono);font-weight:700;color:var(--hf);">${fN(buvRecetteAuj)} TND</span></div>
        <div class="fb mb6"><span style="font-size:11px;">Recette mois</span><span style="font-family:var(--font-mono);color:var(--bl);">${fN(buvRecetteMois)} TND</span></div>
        <div class="fb"><span style="font-size:11px;">Bénéfice</span><span style="font-family:var(--font-mono);font-weight:700;color:${buvBenef>=0?'var(--hf)':'var(--er-c)'};">${buvBenef>=0?'+':''}${fN(buvBenef)} TND</span></div>
      </div>
      <div class="card" style="padding:16px;border-top:3px solid ${(alStk+travU+coExp+aboExp+facImpa)>0?'var(--er-c)':'var(--hf)'};">
        <div style="font-size:11px;font-weight:700;color:var(--ink3);margin-bottom:10px;">🔔 ALERTES</div>
        ${alStk>0?`<div class="fb mb4"><span style="font-size:11px;color:var(--er-c);">⚠️ Ruptures stock</span><span class="bdg b-err">${alStk}</span></div>`:''}
        ${travU>0?`<div class="fb mb4"><span style="font-size:11px;color:var(--er-c);">🔴 Travaux urgents</span><span class="bdg b-err">${travU}</span></div>`:''}
        ${facImpa>0?`<div class="fb mb4"><span style="font-size:11px;color:var(--wa-c);">📋 Factures impayées</span><span class="bdg b-pend">${facImpa}</span></div>`:''}
        ${coExp>0?`<div class="fb mb4"><span style="font-size:11px;color:var(--wa-c);">📄 Contrats expirés</span><span class="bdg b-pend">${coExp}</span></div>`:''}
        ${aboExp>0?`<div class="fb mb4"><span style="font-size:11px;color:var(--wa-c);">🏃 Abonnements expirés</span><span class="bdg b-pend">${aboExp}</span></div>`:''}
        ${(alStk+travU+coExp+aboExp+facImpa)===0?'<div style="color:var(--hf);font-size:11px;">✅ Tout est en ordre</div>':''}
      </div>
    </div>

    <!-- Factures récentes -->
    <div class="card mb14">
      <div class="ch">
        <span class="ct">Factures récentes</span>
        <button class="btn btn-sm btn-ol" onclick="nav('historique')">Voir tout →</button>
      </div>
      <div class="tw">
        <table>
          <thead><tr><th>N°</th><th>Client</th><th>Date</th><th>TTC</th><th>Statut</th></tr></thead>
          <tbody>
            ${fs.slice(0,5).map(f=>`<tr>
              <td class="mono sm">${esc(f.num||'—')}</td>
              <td style="font-weight:500;">${esc(f.clientNom||'—')}</td>
              <td class="mono sm">${f.date||'—'}</td>
              <td class="mono sm" style="color:var(--hf);font-weight:700;">${fN(f.totals?.ttc||0)} TND</td>
              <td><span class="bdg ${f.status==='paid'?'b-ok':f.status==='pending'?'b-pend':'b-ink'}">${f.status==='paid'?'Payée':f.status==='pending'?'En attente':f.status||'—'}</span></td>
            </tr>`).join('') || '<tr><td colspan="5" class="empty">Aucune facture</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>

    <!-- Accès rapides -->
    <div class="card">
      <div class="ch"><span class="ct">Accès rapides</span></div>
      <div class="cb">
        <div class="flex gap8" style="flex-wrap:wrap;">
          ${[
            {icon:'🧾',label:'Nouvelle facture',id:'facture'},
            {icon:'🛒',label:'Nouvel achat',id:'achats'},
            {icon:'🏢',label:'Espaces',id:'espaces'},
            {icon:'🏃',label:'Abonnés',id:'abonnes'},
            {icon:'📋',label:'Contrats',id:'contrats'},
            {icon:'🔧',label:'Travaux',id:'travaux'},
            {icon:'📦',label:'Stock',id:'stock'},
            {icon:'☕',label:'Buvette',id:'buvette'},
            {icon:'👥',label:'RH Avancé',id:'rh'},
            {icon:'⚙️',label:'Paramètres',id:'params'},
          ].map(a=>`<button onclick="nav('${a.id}')" class="btn btn-ol btn-sm">${a.icon} ${a.label}</button>`).join('')}
        </div>
      </div>
    </div>

    `;
  } catch(err) {
    el.innerHTML = '<div style="padding:20px;background:var(--er-bg);border-radius:10px;color:var(--er-c);font-family:monospace;">Erreur dashboard: ' + err.message + '</div>';
    console.error('renderDash error:', err);
  }
}

function setAE(e){S.achEnt=e;['HF','SG'].forEach(x=>{const btn=$('AE-'+x);if(!btn)return;const k=x.toLowerCase();if(k===e){btn.style.background=e==='hf'?'#0F7B5A':'#C4520A';btn.style.color='#fff';btn.style.border='2px solid transparent';}else{btn.style.background='#fff';btn.style.color=e==='hf'?'#C4520A':'#0F7B5A';btn.style.border=`2px solid ${k==='hf'?'#ECFDF5':'#FFF7ED'}`;}});}

function renderAchGrid(){
  const q=(v('ACH-Q')||'').toLowerCase();
  const list=getAllAchs().filter(a=>!q||(a.fournisseur+a.num).toLowerCase().includes(q)).reverse();
  const g=$('ACH-GRID');if(!g)return;
  g.innerHTML=list.length?list.map(a=>`<div style="background:#fff;border:1px solid #E8E8E5;border-radius:10px;padding:12px;border-top:3px solid ${entColor(a.ent)};box-shadow:0 1px 3px rgba(0,0,0,.05);">
    <div class="fb mb6"><div><div style="font-size:12px;font-weight:600;">${esc(a.fournisseur||'—')}</div><div class="mono muted sm">${esc(a.num||'—')}</div></div><div class="mono" style="font-size:14px;font-weight:700;color:${entColor(a.ent)};">${fN(a.ttc)}</div></div>

function calcAch(){const ht=parseFloat(v('A-HT'))||0,tv=parseFloat(v('A-TVA'))||0,ti=parseInt(v('A-TIMBRE'))||0,rp=parseFloat(v('A-RS'))||0,tva=ht*(tv/100),ttc=ht+tva+ti,rs=ht*(rp/100);const s=(id,val)=>{const e=$(id);if(e)e.textContent=fN(val)+' TND';};s('AT-TVA',tva);s('AT-TTC',ttc);s('AT-RS',rs);}

function saveAch(){
  const fo=v('A-FOU').trim();if(!fo){alert('Fournisseur requis');return;}
  const e=S.achEnt||'hf';
  const ht=parseFloat(v('A-HT'))||0,tvaPct=parseFloat(v('A-TVA'))||0,ti=parseInt(v('A-TIMBRE'))||0,rsPct=parseFloat(v('A-RS'))||0,tva=ht*(tvaPct/100),ttc=ht+tva+ti,rs=ht*(rsPct/100);
  const a={id:'A'+Date.now(),ent:e,fournisseur:fo,mf:v('A-MF'),num:v('A-NUM'),date:v('A-DATE'),cat:v('A-CAT'),ht,tvaPct,tva,timbre:ti,rsPct,rs,ttc,net:ttc-rs,paiement:v('A-PAY'),notes:v('A-NOTES'),hasFile:!!achFile,fileName:achFile?.name||null,createdAt:new Date().toISOString()};
  if(!S.achs[e])S.achs[e]=[];S.achs[e].push(a);achFile=null;save();
  alert(`✅ Achat enregistré — ${S.params[e].nom}`);renderAchats();
}

function compT(){
  let ht=0,tva7=0,tva13=0,tva19=0;
  const dev=v('F-DEV')||'TND';const rem=+(v('F-REM')||0);const timbre=$('F-TIMBRE')?.checked?1:0;const rsPct=+(v('F-RS')||0);
  (S.lines||[]).forEach(l=>{const ln=l.qty*l.pu;ht+=ln;const n=ln*(1-rem/100);if(l.tva==7)tva7+=n*.07;else if(l.tva==13)tva13+=n*.13;else if(l.tva==19)tva19+=n*.19;});
  const htN=ht*(1-rem/100),tvaT=tva7+tva13+tva19,ttc=htN+tvaT+timbre,rs=htN*(rsPct/100),net=ttc-rs;
  const s=(id,val)=>{const e=$(id);if(e)e.textContent=fN(val)+' '+dev;};
  s('T-HT',ht);s('T-HTN',htN);s('T-TIMBRE',timbre);s('T-RS',rs);
  if($('T-TTC'))$('T-TTC').textContent=fN(ttc)+' '+dev;s('T-NET',net);
  const rp=$('T-RSP');if(rp)rp.textContent=rsPct>0?`(${rsPct}%)`:'';
  let tvH='';
  if(tva7>0)tvH+=`<div style="background:#ECFDF5;border-radius:5px;padding:4px 8px;margin:2px 0;display:flex;justify-content:space-between;font-size:12px;"><span style="color:#0F7B5A;">TVA 7%</span><span class="mono" style="color:#0F7B5A;">${fN(tva7)} ${dev}</span></div>`;
  if(tva13>0)tvH+=`<div style="background:#ECFDF5;border-radius:5px;padding:4px 8px;margin:2px 0;display:flex;justify-content:space-between;font-size:12px;"><span style="color:#0F7B5A;">TVA 13%</span><span class="mono" style="color:#0F7B5A;">${fN(tva13)} ${dev}</span></div>`;
  if(tva19>0)tvH+=`<div style="background:#ECFDF5;border-radius:5px;padding:4px 8px;margin:2px 0;display:flex;justify-content:space-between;font-size:12px;"><span style="color:#0F7B5A;">TVA 19%</span><span class="mono" style="color:#0F7B5A;">${fN(tva19)} ${dev}</span></div>`;
  if(!tvH)tvH=`<div style="background:#ECFDF5;border-radius:5px;padding:4px 8px;margin:2px 0;display:flex;justify-content:space-between;font-size:12px;"><span style="color:#0F7B5A;">TVA exonéré</span><span class="mono" style="color:#0F7B5A;">${fN(0)}</span></div>`;
  if($('TVA-LINES'))$('TVA-LINES').innerHTML=tvH;
  return{ht,htN,tva7,tva13,tva19,tvaT,timbre,rs,ttc,net};
}

  const conds={immediate:'Paiement immédiat','30j':'30 jours net','60j':'60 jours net',virement:'Virement bancaire'};

  const n2w=(n)=>{
    if(isNaN(n)||n<0)return '';

      if(x<100){const d1=Math.floor(x/10),u1=x%10;if(d1===7||d1===9)return di[d1]+'-'+(d1===9&&u1===0?'cent':u[10+u1]);return di[d1]+(u1===1&&d1!==8?' et un':u1>0?'-'+u[u1]:'');}

      const k=Math.floor(x/1000);return(k>1?conv(k)+' ':'')+'mille'+(x%1000>0?' '+conv(x%1000):'');
    };
    const entier=Math.floor(n);
    const dec=Math.round((n-entier)*1000);
    let res=conv(entier).charAt(0).toUpperCase()+conv(entier).slice(1)+' '+dev;

function n2w(n){
  function c2(n){if(n<20)return u[n];const di=Math.floor(n/10),un=n%10;if(di===7||di===9)return d[di]+(un===1&&di===7?'-et-':'-')+(u[10+un]||u[un]);if(di===8)return 'quatre-vingt'+(un>0?'-'+u[un]:'s');return d[di]+(un===1?'-et-un':un>0?'-'+u[un]:'');}
  function c3(n){if(n===0)return'';if(n<100)return c2(n);const h=Math.floor(n/100),r=n%100;return(h===1?'cent':u[h]+' cent')+(r>0?' '+c2(r):(h>1?'s':''));}
  const dN=Math.floor(n),mil=Math.round((n-dN)*1000);
  if(dN===0&&mil===0)return'zéro dinar';
  let res='';
  const mill=Math.floor(dN/1000),cent=dN%1000;
  if(mill>0)res+=(mill===1?'mille':c3(mill)+' mille')+' ';
  if(cent>0)res+=c3(cent)+' ';
  res+= (dN>1?'dinars':'dinar');
  if(mil>0)res+=' et '+c3(mil)+' '+(mil>1?'millimes':'millime');
  return res.trim();
}

function saisirVente(dateV){
  var desc=(document.getElementById('VT-DESC')?.value||'').trim();
  var mnt=parseFloat(document.getElementById('VT-MNT')?.value)||0;
  if(!desc){alert('Description requise');return;}
  if(!mnt){alert('Montant requis');return;}
  var pay=document.getElementById('VT-PAY')?.value||'especes';
  var client=(document.getElementById('VT-CLIENT')?.value||'').trim();
  if(pay==='credit'&&!client){alert('Nom du client requis pour un crédit');return;}
  var heure=document.getElementById('VT-HEURE')?.value||new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  (S.ventes||[]).push({id:'V'+Date.now(),date:dateV,heure,desc,articles:desc,lignes:[],total:mnt,paiement:pay,client});
  if(pay==='credit'&&client) addCreditFromVente(client,mnt,dateV.slice(0,7));
  save();
  document.getElementById('SAISIE-VENTE-FORM').style.display='none';
  ['VT-DESC','VT-MNT','VT-CLIENT'].forEach(function(x){var e=document.getElementById(x);if(e)e.value='';});
  renderRecetteJour();
  if(typeof toast==='function') toast('✅ Vente enregistrée — '+fN(mnt)+' TND','ok');
}

function updCredit(id,field,val){
  var cr=(S.credits||[]).find(function(x){return x.id===id;});if(!cr)return;
  cr[field]=val;
  if(field==='solde'&&val) cr.soldeLe=today();
  save();
}

function addCreditFromVente(client,montant,mois){
  if(!S.credits) S.credits=[];
  var existing=(S.credits||[]).find(function(cr){return cr.client===client&&cr.mois===mois&&!cr.solde;});
  if(existing){existing.montant=(existing.montant||0)+montant;}
  else{(S.credits||[]).push({id:'CR'+Date.now(),client,montant,mois,paye:0,solde:false,date:today()});}
  save();
}

function buildOpCard(op,emps,color){
  var aff=emps.filter(function(e){return(e.operationIds||[]).indexOf(op.id)>=0;});
  var non=emps.filter(function(e){return(e.operationIds||[]).indexOf(op.id)<0;});
  var isCust=op.id.indexOf('cli_')<0&&op.id.indexOf('hf_')<0;
  var editBtns=isCust?
    '<div class="flex gap4">'+
    '<button class="btn-ico" onclick="editOperation(\''+op.id+'\')" title="Modifier">✏️</button>'+
    '<button class="btn-ico" style="color:var(--er-c);" onclick="deleteOperation(\''+op.id+'\')">🗑</button>'+
    '</div>':'';
  var h='<div style="background:var(--white);border:1px solid var(--border);border-radius:var(--r2);padding:14px;border-top:3px solid '+color+';">';
  h+='<div class="fb mb8">';
  h+='<div style="font-size:13px;font-weight:700;color:'+color+';">'+esc(op.nom)+'</div>';
  h+=editBtns;
  h+='</div>';
  h+='<div class="flex gap4 mb8"><span style="font-size:10px;font-weight:700;background:'+color+'20;color:'+color+';padding:2px 8px;border-radius:8px;">'+aff.length+' agent(s)</span></div>';
  // Agents affectés
  if(aff.length){
    h+='<div style="margin-bottom:6px;">';
    aff.forEach(function(e){
      h+='<span style="font-size:10px;background:var(--hf2);color:var(--hf);padding:2px 7px;border-radius:8px;margin:2px;display:inline-block;">✅ '+esc(e.nom)+
        '<button style="background:none;border:none;cursor:pointer;color:var(--er-c);font-size:10px;margin-left:3px;" onclick="toggleAgentOp(\''+e.id+'\',\''+op.id+'\',false)">×</button>'+
        '</span>';
    });
    h+='</div>';
  }
  // Affecter un agent
  if(non.length){
    h+='<select onchange="if(this.value){toggleAgentOp(this.value,\''+op.id+'\',true);this.value=\'\'}" style="width:100%;padding:5px 8px;border:1.5px solid var(--border);border-radius:var(--r);font-size:11px;outline:none;margin-top:4px;">';
    h+='<option value="">+ Affecter un agent...</option>';
    non.forEach(function(e){
      h+='<option value="'+e.id+'">'+esc(e.nom)+'</option>';
    });
    h+='</select>';
  } else if(!aff.length) {
    h+='<div style="font-size:11px;color:var(--ink3);font-style:italic;">Aucun agent disponible</div>';
  }
  h+='</div>';
  return h;
}

function showAddOp(type){
  document.getElementById("OPS-FORM").style.display="block";
  document.getElementById("OPS-FT").textContent="Nouvelle opération Synergy Growth";
  document.getElementById("OPS-TYPE").value="sg";
  document.getElementById("OPS-NOM").value="";
  document.getElementById("OPS-DESC").value="";
  document.getElementById("OPS-NOM").focus();
}

function saveOperation(){
  var nom=(document.getElementById('OPS-NOM')||{}).value||'';
  nom=nom.trim();
  if(!nom){alert("Nom requis");return;}
  var desc=(document.getElementById('OPS-DESC')||{}).value||'';
  if(!S.operations)S.operations=[];
  var eidField=document.getElementById('OPS-EID');
  var existingId=eidField?eidField.value:'';
  if(existingId){
    // Edit existing
    var idx=(S.operations||[]).findIndex(function(op){return op.id===existingId;});
    if(idx>=0){S.operations[idx].nom=nom;S.operations[idx].desc=desc;}
  } else {
    // New operation
    (S.operations||[]).push({id:'op'+Date.now(),nom:nom,desc:desc,type:'sg'});
  }
  save();
  var form=document.getElementById('OPS-FORM');
  if(form)form.style.display='none';
  renderRHOps();
  if(typeof toast==='function')toast('✅ Opération enregistrée','ok');
}


function editOperation(id){
  var op=(S.operations||[]).find(function(x){return x.id===id;});
  if(!op)return;
  var form=document.getElementById('OPS-FORM');
  if(!form)return;
  form.style.display='block';
  var ft=document.getElementById('OPS-FT');
  if(ft)ft.textContent='Modifier opération';
  var nomEl=document.getElementById('OPS-NOM');
  if(nomEl)nomEl.value=op.nom||'';
  var descEl=document.getElementById('OPS-DESC');
  if(descEl)descEl.value=op.desc||'';
  var eidEl=document.getElementById('OPS-EID');
  if(eidEl)eidEl.value=id;
}

function deleteOperation(id){
  if(!confirm("Supprimer ?"))return;
  S.operations=(S.operations||[]).filter(function(op){return op.id!==id;});
  (S.emps||[]).forEach(function(e){if(e.operationIds)e.operationIds=e.operationIds.filter(function(x){return x!==id;});});
  save();renderRHOps();
}

function toggleAgentOp(empId,opId,add){
  var emp=(S.emps||[]).find(function(e){return e.id===empId;});
  if(!emp)return;
  if(!emp.operationIds)emp.operationIds=[];
  if(add){if(emp.operationIds.indexOf(opId)<0)emp.operationIds.push(opId);}
  else{emp.operationIds=emp.operationIds.filter(function(x){return x!==opId;});}
  save();renderRHOps();
  if(typeof toast==='function')toast(add?'✅ Agent affecté':'✅ Agent retiré','ok');
}

function getEmpOpsLabel(emp){
  if(!emp||!emp.operationIds||!emp.operationIds.length)return'';
  var clisSG=(S.clients||[]).filter(function(cl){return cl.ent==='sg'||!cl.ent;});
  var allOps=clisSG.map(function(cl){return{id:'cli_'+cl.id,nom:cl.nom};})
    .concat(S.operations||[]);
  var labels=emp.operationIds.map(function(id){
    var op=allOps.find(function(o){return o.id===id;});
    return op?esc(op.nom):null;
  }).filter(Boolean);
  if(!labels.length)return'';
  return labels.map(function(l){return'<span style="font-size:9px;background:var(--sg2);color:var(--sg);padding:1px 6px;border-radius:4px;margin-right:3px;font-weight:700;">'+l+'</span>';}).join('');
}

function calcEquipAffectes(){
  var result={};
  if(!S.equipements)return result;
  (S.equipements||[]).forEach(function(eq){result[eq.id]={total:eq.qty||0,affectes:0,reste:eq.qty||0};});
  (S.espaces||[]).forEach(function(esp){
    if(!esp.equipIds)return;
    Object.entries(esp.equipIds).forEach(function(e){
      var eqId=e[0],qty=e[1];
      if(!result[eqId])result[eqId]={total:0,affectes:0,reste:0};
      result[eqId].affectes+=(qty||0);
      result[eqId].reste=result[eqId].total-result[eqId].affectes;
    });
  });
  return result;
}

    action:'sync',

function renderPtRecap(){
  const mo=v('PT-MOIS');if(!mo)return;
  const list=(S.pts||[]).filter(p=>p.date.startsWith(mo)&&p.out);
  const byEmp={};
  list.forEach(p=>{
    if(!byEmp[p.empId])byEmp[p.empId]={pts:[],h:0,c:0};
    byEmp[p.empId].pts.push(p);
    const h=dH(p.in,p.out);byEmp[p.empId].h+=h;
    const emp=(S.emps||[]).find(e=>e.id===p.empId);
    if(emp)byEmp[p.empId].c+=h*(emp.taux||0);
  });
  let total=0;
  const rows=Object.entries(byEmp).map(([eid,d])=>{
    const emp=(S.emps||[]).find(e=>e.id===eid);if(!emp)return'';
    const j=new Set(d.pts.map(p=>p.date)).size;
    total+=d.c;
    return`<tr><td style="font-weight:500;">${esc(emp.nom)}</td><td class="muted sm">${esc(emp.role)}</td><td>${entChip(emp.ent)}</td><td class="mono sm">${fN(emp.taux)} TND/h · ${esc(emp.contrat)}</td><td class="mono sm">${j} jours</td><td class="mono sm" style="color:#0F7B5A;font-weight:600;">${fmtH(d.h)}</td><td class="mono sm" style="color:#1D4ED8;font-weight:600;">${fN(d.c)} TND</td></tr>`;
  }).join('');
  $('PT-RECAP-BODY').innerHTML=`<div class="card"><div class="tw"><table><thead><tr><th>Employé</th><th>Rôle</th><th>Entité</th><th>Taux/h · Contrat</th><th>Jours</th><th>Total heures</th><th>Coût total</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Aucune donnée pour ce mois</td></tr>'}</tbody><tfoot><tr><td colspan="6" style="text-align:right;padding:10px 12px;font-weight:700;background:#F7F7F5;">COÛT RH TOTAL DU MOIS</td><td style="padding:10px 12px;font-family:monospace,monospace;font-weight:700;color:#1D4ED8;background:#F7F7F5;">${fN(total)} TND</td></tr></tfoot></table></div></div>`;
  $('PT-RECAP-BODY').innerHTML=`<div class="card"><div class="tw"><table><thead><tr><th>Employé</th><th>Rôle</th><th>Entité</th><th>Taux/h · Contrat</th><th>Jours</th><th>Total heures</th><th>Coût total</th></tr></thead><tbody>${rows||'<tr><td colspan="7" class="empty">Aucune donnée pour ce mois</td></tr>'}</tbody><tfoot><tr><td colspan="6" style="text-align:right;padding:10px 12px;font-weight:700;background:#F7F7F5;">COÛT RH TOTAL DU MOIS</td><td style="padding:10px 12px;font-family:monospace,monospace;font-weight:700;color:#1D4ED8;background:#F7F7F5;">${fN(total)} TND</td></tr></tfoot></table></div></div>`;
}

function buildRapport(){
  var el=document.getElementById('RPT-BODY');if(!el)return;
  var moEl=document.getElementById('RPT-MO');
  var mo=moEl?moEl.value:today().slice(0,7);
  var emps=(S.emps||[]).filter(function(e){return e.ent==='sg';});
  var ts=(S.timesheets||[]).filter(function(t){return t.mois===mo;});
  var abs=(S.absences||[]).filter(function(a){return a.date&&a.date.startsWith(mo);});
  var primes=(S.primes||[]).filter(function(p){return p.mois===mo;});
  var totalMasse=0;

  var html='<div class="card"><div class="ch"><span class="ct">Récapitulatif '+mo+'</span></div>'+
    '<div class="cb"><div class="tw"><table style="font-size:12px;border-collapse:collapse;width:100%;">'+
    '<thead><tr style="background:var(--sand);">'+
    '<th style="padding:8px;">Employé</th><th style="padding:8px;">Heures</th>'+
    '<th style="padding:8px;">Absences</th><th style="padding:8px;">Primes</th>'+
    '<th style="padding:8px;text-align:right;">Total à payer</th>'+
    '</tr></thead><tbody>';

  emps.forEach(function(e){
    var t=ts.find(function(x){return x.empId===e.id;})||{totalH:0,totalPay:0};
    var nbAbs=abs.filter(function(a){return a.empId===e.id;}).length;
    var totalPrimes=primes.filter(function(p){return p.empId===e.id;}).reduce(function(s,p){return s+p.mnt;},0);
    var pay=(t.totalPay||0)+totalPrimes;
    totalMasse+=pay;
    html+='<tr style="border-bottom:1px solid var(--border);">'+
      '<td style="padding:8px;font-weight:600;">'+esc(e.nom)+
      '<div style="font-size:10px;color:var(--ink3);">'+esc(e.role||'')+'</div>'+
      '<div style="margin-top:2px;">'+getEmpOpsLabel(e)+'</div></td>'+
      '<td style="padding:8px;text-align:center;font-family:monospace;">'+(t.totalH||0)+'h</td>'+
      '<td style="padding:8px;text-align:center;color:'+(nbAbs>0?'var(--er-c)':'var(--hf)')+';">'+nbAbs+'</td>'+
      '<td style="padding:8px;text-align:center;font-family:monospace;color:var(--hf);">+'+fN(totalPrimes)+'</td>'+
      '<td style="padding:8px;text-align:right;font-family:monospace;font-weight:700;color:var(--sg);">'+fN(pay)+' TND</td>'+
      '</tr>';
  });

  if(!emps.length){
    html+='<tr><td colspan="5" class="empty">Aucun agent Synergy Growth</td></tr>';
  }

  html+='</tbody><tfoot><tr style="background:var(--sand);font-weight:700;">'+
    '<td style="padding:8px;">MASSE SALARIALE TOTALE</td><td colspan="3"></td>'+
    '<td style="padding:8px;text-align:right;font-family:monospace;font-size:14px;color:var(--sg);">'+fN(totalMasse)+' TND</td>'+
    '</tr></tfoot></table></div></div></div>';

  el.innerHTML=html;
}

function saveEmp(){
  var id=document.getElementById('EMP-ID')?.value;
  var nom=(document.getElementById('EMP-NOM')?.value||'').trim();
  if(!nom){alert('Nom requis');return;}
  var emp={id:id||'E'+Date.now(),nom:nom,ent:'sg',
    prenom:document.getElementById('EMP-PRN')?.value||'',
    role:document.getElementById('EMP-ROL')?.value||'',
    cin:document.getElementById('EMP-CIN')?.value||'',
    cnss:document.getElementById('EMP-CNSS')?.value||'',
    contrat:document.getElementById('EMP-CONT')?.value||'CDI',
    tel:document.getElementById('EMP-TEL')?.value||'',
    email:document.getElementById('EMP-EMAIL')?.value||'',
    dateEmb:document.getElementById('EMP-DATE')?.value||today(),
    taux:parseFloat(document.getElementById('EMP-TAUX')?.value)||0,
    salBase:parseFloat(document.getElementById('EMP-SAL')?.value)||0,
    rib:document.getElementById('EMP-RIB')?.value||''};
  if(id){var i=(S.emps||[]).findIndex(function(x){return x.id===id;});if(i>=0)S.emps[i]=emp;else (S.emps||[]).push(emp);}
  else (S.emps||[]).push(emp);
  save();
  document.getElementById('OV-EMP')?.classList.remove('on');
  renderRHEmps();
  if(typeof toast==='function')toast('✅ Agent enregistré','ok');
}
function delEmp(id){
  S.emps=(S.emps||[]).filter(function(e){return e.id!==id;});
  save();renderRHEmps();
}

function editEmp(id){showERHForm(id);}

function renderTimesheet(){
  var el=document.getElementById('rh-ts');if(!el)return;
  var mo=today().slice(0,7);
  var emps=(S.emps||[]).filter(function(e){return e.ent==='sg';});
  var pts=S.pts||[];

  // Header avec sélecteur de mois
  var html='<div class="fb mb12 mt10">';
  html+='<span style="font-size:12px;font-weight:700;">⏱ Pointage — '+mo+'</span>';
  html+='<div class="flex gap6">';
  html+='<input type="month" id="TS-MO" value="'+mo+'" onchange="renderTimesheet()" style="background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:5px 9px;font-size:12px;outline:none;">';
  html+='<button class="btn btn-hf btn-sm" onclick="showPtManuel()">+ Saisie manuelle</button>';
  html+='</div></div>';

  // Stats du mois
  var moEl=document.getElementById('TS-MO');
  var moVal=moEl?moEl.value:mo;
  var ptsMo=pts.filter(function(p){return (p.date||'').startsWith(moVal)&&p.out;});
  var totalH=ptsMo.reduce(function(s,p){
    if(!p.in||!p.out)return s;
    var parts1=p.in.split(':').map(Number),parts2=p.out.split(':').map(Number);
    return s+(parts2[0]*60+parts2[1]-parts1[0]*60-parts1[1])/60;
  },0);

  html+='<div class="g3 mb12">';
  html+='<div class="stat shf"><div class="stat-l">Jours pointés</div><div class="stat-v">'+ptsMo.length+'</div></div>';
  html+='<div class="stat sbl"><div class="stat-l">Total heures</div><div class="stat-v">'+totalH.toFixed(1)+'h</div></div>';
  html+='<div class="stat ssg"><div class="stat-l">Agents actifs</div><div class="stat-v">'+emps.length+'</div></div>';
  html+='</div>';

  // Formulaire saisie manuelle (caché par défaut)
  html+='<div id="PT-FORM" style="display:none;" class="card mb12">';
  html+='<div class="ch"><span class="ct">Saisie manuelle</span><button class="btn-ico" onclick="document.getElementById(\'PT-FORM\').style.display=\'none\'">✕</button></div>';
  html+='<div class="cb"><div class="fr c3 mb8">';
  html+='<div class="fg"><label>Employé</label><select id="PT-EMP" style="width:100%;padding:6px 9px;border:1.5px solid var(--border);border-radius:var(--r);outline:none;">';
  emps.forEach(function(e){html+='<option value="'+e.id+'">'+esc(e.nom)+'</option>';});
  html+='</select></div>';
  html+='<div class="fg"><label>Date</label><input type="date" id="PT-DATE" value="'+today()+'"></div>';
  html+='<div class="fg"><label>Entrée</label><input type="time" id="PT-IN" value="08:00"></div>';
  html+='</div><div class="fr c2 mb8">';
  html+='<div class="fg"><label>Sortie</label><input type="time" id="PT-OUT" value="17:00"></div>';
  html+='<div class="fg"><label>Note</label><input id="PT-NOTE" placeholder="Optionnel..."></div>';
  html+='</div>';
  html+='<button class="btn btn-hf btn-sm" onclick="savePtManuel()">💾 Enregistrer</button></div></div>';

  // Tableau de pointage
  html+='<div class="tw card">';
  html+='<table><thead><tr><th>Employé</th><th>Date</th><th>Entrée</th><th>Sortie</th><th>Durée</th><th>Note</th><th></th></tr></thead><tbody>';

  var ptsMoAll=(pts||[]).filter(function(p){return (p.date||'').startsWith(moVal);}).reverse();
  if(ptsMoAll.length){
    ptsMoAll.forEach(function(p){
      var emp=(S.emps||[]).find(function(e){return e.id===p.empId;})||{nom:'?'};
      var duree='';
      if(p.in&&p.out){
        var parts1=p.in.split(':').map(Number),parts2=p.out.split(':').map(Number);
        var mins=parts2[0]*60+parts2[1]-parts1[0]*60-parts1[1];
        duree=Math.floor(mins/60)+'h'+(mins%60>0?String(mins%60).padStart(2,'0'):'');
      }
      html+='<tr>';
      html+='<td style="font-weight:600;">'+esc(emp.nom)+'</td>';
      html+='<td class="mono sm">'+esc(p.date||'')+'</td>';
      html+='<td class="mono sm">'+esc(p.in||'—')+'</td>';
      html+='<td class="mono sm">'+esc(p.out||'<span style="color:var(--wa-c)">En cours</span>')+'</td>';
      html+='<td class="mono sm" style="font-weight:700;color:var(--hf);">'+esc(duree||'—')+'</td>';
      html+='<td class="muted sm">'+esc(p.note||'—')+'</td>';
      html+='<td><button class="btn-ico" style="color:var(--er-c);" data-id="'+p.id+'" onclick="S.pts=(S.pts||[]).filter(function(x){return x.id!==this.dataset.id;}.bind(this));save();renderTimesheet();">🗑</button></td>';
      html+='</tr>';
    });
  } else {
    html+='<tr><td colspan="7" class="empty">Aucun pointage ce mois — utilisez la saisie manuelle</td></tr>';
  }
  html+='</tbody></table></div>';

  el.innerHTML=html;
}

function showPtManuel(){
  var f=document.getElementById('PT-FORM');
  if(f){f.style.display='block';}
}

function savePtManuel(){
  var empId=document.getElementById('PT-EMP')?.value;
  var date=document.getElementById('PT-DATE')?.value;
  var tin=document.getElementById('PT-IN')?.value;
  var tout=document.getElementById('PT-OUT')?.value;
  if(!empId||!date||!tin){alert('Employé, date et heure d\'entrée requis');return;}
  if(!S.pts)S.pts=[];
  S.pts.push({id:'PT'+Date.now(),empId:empId,date:date,in:tin,out:tout||null,
    note:document.getElementById('PT-NOTE')?.value||''});
  save();
  document.getElementById('PT-FORM').style.display='none';
  renderTimesheet();
  if(typeof toast==='function')toast('✅ Pointage enregistré','ok');
}




function f2b64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result.split(',')[1]);r.onerror=()=>rej(new Error('Err'));r.readAsDataURL(file);});}

function processAchFile(file){
  achFile=file;
  $('AF-INFO').style.display='flex';
  $('AF-NM').textContent=file.name+' ('+Math.round(file.size/1024)+'KB)';
  if(file.type.startsWith('image/')){const r=new FileReader();r.onload=e=>{$('AF-PREV').innerHTML=`<img src="${e.target.result}" style="max-width:100%;max-height:220px;border-radius:6px;object-fit:contain;">`;};r.readAsDataURL(file);}
  else{$('AF-PREV').innerHTML=`<div style="text-align:center;padding:20px;"><div style="font-size:28px;margin-bottom:6px;">📄</div><p style="font-size:12px;font-weight:500;">${esc(file.name)}</p></div>`;}
  parseAI(file);
}

function applySheetData(data){
  if(!data)return;
  Object.keys(data).forEach(function(k){
    if(!(k in S)) return;
    var val = data[k];
    // Only update arrays if they have data (don't overwrite with empty)
    if(Array.isArray(val) && val.length === 0 && Array.isArray(S[k]) && S[k].length > 0) return;
    if(val && typeof val === 'object' && !Array.isArray(val)){
      // For objects like facs:{hf:[],sg:[]}, merge non-empty
      Object.keys(val).forEach(function(subk){
        if(!S[k]) S[k]={};
        var subval = val[subk];
        if(Array.isArray(subval) && subval.length === 0 && Array.isArray(S[k][subk]) && (S[k][subk]||[]).length > 0) return;
        S[k][subk] = subval;
      });
    } else {
      S[k] = val;
    }
  });
  save();
  var activePage = (document.querySelector('.page.on')||{id:'PG-dashboard'}).id.replace('PG-','');
  if(typeof renderPage==='function') renderPage(activePage||'dashboard');
}

async function syncToSheets(){
  if(window._syncBusy) return;
  window._syncBusy=true;
  showSyncBadge('saving');
  try{
    const payload=JSON.stringify(buildPayload());
    console.log('[SyncTo] Payload size:', payload.length, 'bytes');
    console.log('[SyncTo] URL:', PROXY_URL);
    
    const res=await fetch(PROXY_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({url:GS_URL,payload:payload})
    });
    
    console.log('[SyncTo] HTTP status:', res.status, res.statusText);
    const text=await res.text();
    console.log('[SyncTo] Response raw:', text.substring(0,300));
    
    let json;
    try{ json=JSON.parse(text); }
    catch(pe){ throw new Error('Réponse non-JSON: '+text.substring(0,100)); }
    
    console.log('[SyncTo] Response JSON:', json);
    
    if(json.status==='ok'||json.ok===true){
      showSyncBadge('ok');
      if(typeof toast==='function')toast('✅ Synchronisé avec Google Sheets','ok');
    } else {
      throw new Error(json.message||JSON.stringify(json));
    }
  }catch(e){
    console.error('[SyncTo] ERREUR:', e.message);
    showSyncBadge('err');
    if(typeof toast==='function')toast('⚠️ '+e.message,'err');
  } finally {
    window._syncBusy=false;
  }
}

async function syncFromSheets(){

    if((json.status==='ok'||json.ok===true)&&json.data){
      applySheetData(json.data);

      if(typeof toast==='function')toast('✅ Données chargées depuis Google Sheets','ok');

    }
  }catch(e){
    console.error('[SyncFrom] ERREUR:', e.message);
    showSyncBadge('err');
  }
}

// ── Sync Status Management ──────────────────────────
function showSyncBadge(state, count){
  var dot=document.getElementById('SYNC-DOT');
  var txt=document.getElementById('SYNC-TXT');
  var cnt=document.getElementById('SYNC-COUNT');
  var box=document.getElementById('SYNC-STATUS');
  if(!dot||!txt||!box) return;

  // Remove previous states
  box.classList.remove('synced','err','saving');

  if(state==='ok'||state==='synced'){
    dot.style.background='var(--hf)';
    txt.textContent='Synchronisé';
    box.classList.add('synced');
    box.title='Données synchronisées avec Google Sheets ✅\nCliquer pour re-synchroniser';
    if(cnt){ cnt.style.display='none'; }
    try{ localStorage.setItem('erp_unsync','0'); }catch(e){}
    try{ localStorage.setItem('erp_last_sync', new Date().toLocaleString('fr-FR')); }catch(e){}
  } else if(state==='err'){
    dot.style.background='var(--er-c)';
    txt.textContent='Erreur sync';
    box.classList.add('err');
    box.title='Erreur de synchronisation ❌\nCliquer pour réessayer';
    if(cnt){ cnt.style.display='none'; }
  } else if(state==='saving'){
    dot.style.background='var(--bl)';
    txt.textContent='Sync...';
    box.classList.add('saving');
    box.title='Synchronisation en cours...';
    dot.style.animation='spin 1s linear infinite';
    if(cnt){ cnt.style.display='none'; }
    return; // Don't reset animation
  } else if(state==='unsaved'){
    var n = count || parseInt(localStorage.getItem('erp_unsync')||'0');
    dot.style.background='var(--wa-c)';
    txt.textContent='Non sync.';
    box.classList.remove('synced','err','saving');
    box.title='Modifications locales non synchronisées ('+n+' sauvegarde(s))\nCliquer pour synchroniser avec Google Sheets';
    if(cnt){
      if(n>0){ cnt.textContent=n; cnt.style.display='inline'; }
      else { cnt.style.display='none'; }
    }
  }
  // Reset animation
  dot.style.animation='';
}

function initSyncStatus(){
  // Check on startup what the sync state is
  var unsync=parseInt(localStorage.getItem('erp_unsync')||'0');
  var lastSync=localStorage.getItem('erp_last_sync')||'jamais';
  var dot=document.getElementById('SYNC-DOT');
  var txt=document.getElementById('SYNC-TXT');
  var cnt=document.getElementById('SYNC-COUNT');
  var box=document.getElementById('SYNC-STATUS');
  if(!dot||!txt||!box) return;

  if(unsync===0){
    // Check if we ever synced
    if(lastSync!=='jamais'){
      showSyncBadge('synced');
      box.title='Dernière sync: '+lastSync+'\nCliquer pour re-synchroniser';
    } else {
      dot.style.background='#94a3b8';
      txt.textContent='Jamais sync.';
      box.title='Pas encore synchronisé avec Google Sheets\nCliquer pour synchroniser';
    }
  } else {
    showSyncBadge('unsaved', unsync);
  }
}

function expPDF(){
  var inv=document.getElementById('INV');
  if(!inv){alert('Aucune facture à exporter');return;}
  // Utiliser html2canvas + jsPDF si disponible
  if(typeof window.jspdf !== 'undefined' || typeof window.jsPDF !== 'undefined'){
    var jsPDF=window.jsPDF||window.jspdf.jsPDF;
    var el=inv.querySelector('div')||inv;
    if(typeof html2canvas !== 'undefined'){
      html2canvas(el,{scale:2,useCORS:true,allowTaint:true}).then(function(canvas){
        var imgData=canvas.toDataURL('image/png');
        var pdf=new jsPDF('p','mm','a4');
        var w=pdf.internal.pageSize.getWidth();
        var h=(canvas.height*w)/canvas.width;
        // Multi-page if needed
        var pageH=pdf.internal.pageSize.getHeight();
        if(h<=pageH){
          pdf.addImage(imgData,'PNG',0,0,w,h);
        } else {
          var y=0;
          while(y<h){
            pdf.addImage(imgData,'PNG',0,-y,w,h);
            y+=pageH;
            if(y<h)pdf.addPage();
          }
        }
        var num=document.getElementById('F-NUM')||{value:'facture'};
        pdf.save((num.value||'facture')+'.pdf');
      }).catch(function(err){
        console.error('html2canvas error:',err);
        printINV(); // Fallback to print
      });
    } else {
      printINV(); // Fallback
    }
  } else {
    // Fallback: open print dialog
    printINV();
  }
}

              <span id="sync-dot" style="width:6px;height:6px;border-radius:50%;background:#93c5fd;display:inline-block;transition:background .3s;"></span>
              <span id="sync-txt">Sync</span>
            </button>
            <button class="btn btn-ol btn-sm" onclick="nav('facture')">+ Facture</button>
          </div>
      </div>
      <div class="page on" id="PG-dashboard"><div id="DASH"></div></div>
      <div class="page" id="PG-facture"><div id="FAC-FORM"></div></div>
      <div class="page" id="PG-historique"><div id="FAC-HIST"></div><div id="H-BODY"></div></div>
      <div class="page" id="PG-achats"><div id="ACHATS"></div></div>
      
      <div class="page" id="PG-espaces"><div id="ESPACES"></div></div>
      <div class="page" id="PG-abonnes"><div id="ABONNES"></div></div>
      <div class="page" id="PG-contrats"><div id="CONTRATS"></div></div>
      <div class="page" id="PG-stock"><div id="STOCK"></div></div>
      <div class="page" id="PG-buvette"><div id="BUVETTE"></div></div>
      <div class="page" id="PG-travaux"><div id="TRAVAUX"></div></div>
      <div class="page" id="PG-clients"><div id="CLIENTS"></div></div>
      <div class="page" id="PG-params"><div id="PARAMS"></div></div>
      <div class="page" id="PG-rh"><div id="RH-ADV"></div><div id="POINTAGE" style="display:none;"></div></div>
    </main>
  </div>
</div>

<!-- MODALS -->
<div class="ov" id="OV-INV">
  <div style="position:fixed;top:16px;right:16px;display:flex;gap:8px;z-index:600;">
    <button class="btn btn-dk btn-sm" onclick="expPDF()">📄 PDF</button>
    <button class="btn btn-ol btn-sm" onclick="printINV()">🖨</button>
    <button class="btn btn-ol btn-sm" onclick="cm('OV-INV')">✕ Fermer</button>
  </div>
  <div style="background:#fff;border-radius:var(--r3);width:min(860px,96vw);flex-shrink:0;margin:auto;"><div id="INV"></div></div>
</div>
<div class="ov" id="OV-ART" style="align-items:center;">
  <div class="ob" style="max-height:80vh;display:flex;flex-direction:column;">
    <div class="ch"><span class="ct">Catalogue articles</span><button class="btn-ico" onclick="cm('OV-ART')">✕</button></div>
    <div style="padding:10px 16px;border-bottom:1px solid var(--border);"><input id="ART-Q" placeholder="Rechercher..." oninput="renderArtModal()" style="width:100%;background:var(--sand);border:1px solid var(--border);border-radius:var(--r);padding:6px 10px;font-size:12px;outline:none;"></div>
    <div style="overflow-y:auto;flex:1;"><table><thead><tr><th>Réf.</th><th>Désignation</th><th>P.U. HT</th><th>TVA</th><th></th></tr></thead><tbody id="ART-BODY"></tbody></table></div>
  </div>
</div>
<div class="ov" id="OV-ST" style="align-items:center;">
  <div class="ob" style="max-width:300px;padding:20px;">
    <div style="font-size:13px;font-weight:600;margin-bottom:14px;">Changer le statut</div>
    <input type="hidden" id="ST-ID">
    <div class="fg mb12"><label>Statut</label><select id="ST-VAL"><option value="draft">Brouillon</option><option value="pending">En attente</option><option value="paid">Payé</option><option value="cancelled">Annulé</option></select></div>
    <div class="flex gap6"><button class="btn btn-dk btn-sm" onclick="applyStatus()">Appliquer</button><button class="btn btn-ol btn-sm" onclick="cm('OV-ST')">Annuler</button></div>
  </div>
</div>
<div class="ov" id="OV-CAISSE" style="align-items:center;">
  <div class="ob" style="max-width:700px;">
    <div class="ch"><span class="ct">🛒 Caisse Buvette</span><button class="btn-ico" onclick="cm('OV-CAISSE')">✕</button></div>
    <div style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:16px;">
      <div>
        <div style="font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;margin-bottom:8px;">Menu</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:280px;overflow-y:auto;" id="CAISSE-MENU"></div>
      </div>
      <div>
        <div style="font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;margin-bottom:8px;">Panier</div>
        <div id="CAISSE-CART" style="min-height:80px;margin-bottom:12px;"></div>
        <div class="divider"></div>
        <div class="fb" style="font-size:15px;font-weight:700;margin-bottom:12px;"><span>Total</span><span class="mono" id="CAISSE-TOT" style="color:var(--hf);">0.000 TND</span></div>
        <div class="fg mb12"><label>Paiement</label><select id="CAISSE-PAY"><option value="especes">Espèces</option><option value="virement">Virement</option><option value="credit">À crédit</option></select></div>
        <button class="btn btn-hf" style="width:100%;" onclick="encaisser()">✅ Encaisser</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
